name: Bomb build
run-name: Bomb build ${{ github.sha }}

# Costruisce Plezy Glass (fork con Liquid Glass) e lo pubblica come Release del fork.
# L'identita' dell'app (id, nome, authority) si cambia qui, a build time, per non toccare
# android/app/build.gradle.kts, che upstream modifica spesso.

on:
  push:
    branches: [bomb]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bomb-build
  cancel-in-progress: true

env:
  BOMB_APP_ID: it.bomb.plezyglass
  BOMB_APP_NAME: Plezy Glass

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the Flutter version from upstream's build.yml
        run: |
          version=$(grep -m1 -oP 'FLUTTER_VERSION: "\K[^"]+' .github/workflows/build.yml)
          if [ -z "$version" ]; then
            echo "::error::FLUTTER_VERSION not found in .github/workflows/build.yml"
            exit 1
          fi
          echo "FLUTTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch app identity (fails if upstream changed any string)
        run: |
          python3 - <<'PY'
          import os, sys

          app_id = os.environ["BOMB_APP_ID"]
          app_name = os.environ["BOMB_APP_NAME"]

          edits = [
              # (file, old, new, expected occurrences)
              ("android/app/build.gradle.kts",
               'applicationId = "com.edde746.plezy"', f'applicationId = "{app_id}"', 1),
              ("android/app/src/main/AndroidManifest.xml",
               'android:label="Plezy"', f'android:label="{app_name}"', 1),
              ("android/app/src/main/AndroidManifest.xml",
               'android:authorities="com.edde746.plezy.fileprovider"',
               f'android:authorities="{app_id}.fileprovider"', 1),
              ("android/app/src/main/AndroidManifest.xml",
               'android:authorities="com.edde746.plezy.systemshelf.artwork"',
               f'android:authorities="{app_id}.systemshelf.artwork"', 1),
              ("android/app/src/main/kotlin/com/edde746/plezy/ExternalPlayerChannel.kt",
               '"com.edde746.plezy.fileprovider"', f'"{app_id}.fileprovider"', 1),
              ("android/app/src/main/kotlin/com/edde746/plezy/watchnext/SystemShelfArtworkProvider.kt",
               '"com.edde746.plezy.systemshelf.artwork"', f'"{app_id}.systemshelf.artwork"', 1),
          ]

          failed = False
          for path, old, new, expected in edits:
              with open(path, encoding="utf-8", newline="") as f:
                  text = f.read()
              found = text.count(old)
              if found != expected:
                  print(f"::error file={path}::expected {expected} occurrence(s) of {old!r}, found {found}")
                  failed = True
                  continue
              with open(path, "w", encoding="utf-8", newline="") as f:
                  f.write(text.replace(old, new))
          sys.exit(1 if failed else 0)
          PY

      - name: Configure Android signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BOMB_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BOMB_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOMB_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BOMB_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret BOMB_${name}. Without it the release APK would be unsigned."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Analyze our code
        run: flutter analyze lib/bomb

      - name: Build APKs
        run: |
          # versionCode crescente a ogni build: build number upstream + numero del run
          upstream_build=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/.*\+//')
          flutter build apk --release --split-per-abi --dart-define=BOMB_GLASS=true \
            --build-number=$((upstream_build + GITHUB_RUN_NUMBER))

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')
          tag="bomb-${version}-${GITHUB_RUN_NUMBER}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/plezyglass-${version}-${abi}.apk"
          done
          gh release create "$tag" dist/*.apk \
            --target "$GITHUB_SHA" \
            --title "Plezy Glass ${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Fork con Liquid Glass basato su Plezy ${version}. Commit ${GITHUB_SHA}."
